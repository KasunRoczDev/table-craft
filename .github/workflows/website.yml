# Decision 166: publishing a TableCraft release publishes the website at
# https://tablecraft1.dev/, built from that release's tag so the docs match the app
# people download. Run it by hand to republish a tag after editing its release notes. Needs
# Settings → Pages → Source set to GitHub Actions, and a `v*` tag rule on the `github-pages`
# environment, which allows only the default branch until then (RELEASING.md, One-time setup).
name: Website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v1.38.0
        required: true

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    # A beta goes only to beta apps (RELEASING.md), so the site keeps describing the last stable release.
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run website:build
        env:
          # The changelog and the star count read the GitHub API; the token raises its rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      # deploy-pages proves the artifact came from this workflow.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
