appId: dev.table-craft.desktop
productName: TableCraft

directories:
  output: release
  buildResources: build

# Decision 033: the bundles go into app.asar; the built-in plugins ship beside it as real files.
# Vite inlines every runtime dependency, so no node_modules ships. Optional plugins (decision 108)
# are downloaded from npm and never ship.
files:
  - dist/**
  - "!dist/resources/**"
  - "!dist/optional-plugins/**"
  - "!**/*.map"
  - "!node_modules/**"
extraResources:
  - from: dist/resources/plugins
    to: plugins
    filter:
      - "**/*"
      - "!**/*.map"
  # The window icon on Windows and Linux, where the window does not take it from the bundle.
  - from: build/icon.png
    to: icon.png
  # The ER diagram's layout worker is elkjs, taken under EPL-2.0, whose licence must ship with it
  # (decision 157).
  - from: node_modules/elkjs/LICENSE.md
    to: licenses/elkjs-LICENSE.md
  # TableCraft's own licence, its plugin exception and the notice that names both (decision 165).
  - from: ../../LICENSE
    to: licenses/LICENSE
  - from: ../../LICENSE-EXCEPTION
    to: licenses/LICENSE-EXCEPTION
  - from: ../../NOTICE
    to: licenses/NOTICE
asar: true
npmRebuild: false
icon: build/icon.png
# The default leaves x64 unnamed, which reads as universal beside the arm64 DMG.
# Literal, not ${productName}: scripts/update-manifest.ts finds the installers by this name, and the
# live test's build renames the product (plan 020).
artifactName: TableCraft-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  # The DMG is for people; the zip is what the in-app update downloads and unpacks with ditto
  # (decision 044).
  target:
    - dmg
    - zip
  # For a Developer ID build (CSC_LINK or CSC_NAME set) and notarisation. Without one,
  # scripts/package.ts signs ad hoc and turns the hardened runtime off: its library validation
  # refuses an ad-hoc-signed Electron Framework, which has no Team ID (plan 014 deviation).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Finder lists TableCraft under Open With for .sql files without making it the default (plan 163,
  # decision 168). Written here, not as fileAssociations: electron-builder's mac output has no
  # LSItemContentTypes, and macOS matches .sql by its UTI, org.iso.sql.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: SQL File
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - org.iso.sql
        CFBundleTypeExtensions:
          - sql
    # macOS declares org.iso.sql itself; importing it keeps .sql files typed on a system that does not.
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: org.iso.sql
        UTTypeDescription: SQL File
        UTTypeConformsTo:
          - public.plain-text
          - public.source-code
        UTTypeTagSpecification:
          public.filename-extension:
            - sql
          public.mime-type:
            - application/sql

win:
  target: nsis

# build/installer.nsh lists TableCraft under Open with for .sql files (plan 163, decision 168).
nsis:
  include: build/installer.nsh

linux:
  target: AppImage
  category: Development
  # Otherwise the binary is named after the package, `@table-craft/desktop`; Linux binaries are
  # lower case, so it is not `TableCraft` (decision 037).
  executableName: table-craft
  # The desktop entry's MimeType: file managers offer TableCraft for .sql files. The AppImage does
  # not register a default, so whatever opens .sql files today still does.
  fileAssociations:
    - ext: sql
      name: SQL File
      mimeType: application/sql
